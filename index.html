<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./assests/logo.png">
    <title>Spotifiy-Web Players</title>
</head>

<body>
    <div class="main">
        <div class="sidebar">
            <div class="nav">
                <div class="nav-option" style="opacity: 1;">
                    <i class="fa-solid fa-house"></i>
                    <a href="#">Home</a>
                </div>
                <div class="nav-option">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <a href="#">Search</a>
                </div>
            </div>
            <div class="library" >
                <div class="options">
                    <div class="lib-options">
                        <img src="./assests/library_icon.png">
                        <a href="#">Your library</a>
                    </div>
                    <div class="icons">
                        <i class="fa-solid fa-plus"></i>
                    <i class="fa-solid fa-arrow-right"></i> 
                    </div> 
                </div>
                <div class="lib-boxes">
                    <div class="box">
                        <p class="box-p1">  Create Your First Playlist</p>
                        <p class="box-p2"> Its Easy to Help Your</p>
                        <button class="badge"> Create Playlist</button>
                    </div>
                    <div class="box">
                        <p class="box-p1">  Let's find some podcasts to follow</p>
                        <p class="box-p2"> We'll keep you updated on new episodes</p>
                        <button class="badge"> Browse podcasts</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="sticky-nav">
                <div class="sticky-nav-icons">
                <img src="./assests/backward_icon.png">
                <img src="./assests/forward_icon.png">
                </div>
                    <div class="sticky-nav-options">
                        <button class="badge nav-item"> Explore Premium</button>
                  <button class="badge nav-item dark-badge"><i class="fa-solid fa-download"></i> Install App</button>
                  <i class="fa-solid fa-user nav-item"></i>
                    </div>
            </div>
            <div class="cards"></div>
        </div>
        <div class="music-player">music-player</div>
    </div>
</body>

</html>
